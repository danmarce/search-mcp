[project]
name = "search-mcp"
version = "0.1.0"
description = "One broad-web search tool (keyless multi-engine ddgs) exposed over MCP — snippets only, to-standard metadata and result contract"
readme = "README.md"
authors = [
    { name = "Daniel Nunez", email = "danmarce@gmail.com" }
]
license = "MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.0",
    "mcp>=2.2",
    "truststore>=0.10.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
search-mcp = "search_mcp:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
